<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://tile.openstreetmap.org https://*.tile.openstreetmap.org data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'">
<title>DDP Credit Map</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
  :root { --blue:#1d70b8; --green:#2e8540; --purple:#7b3fa0; --amber:#a15c00; --red:#b3261e; --ink:#1b1b1b; --muted:#666; }
  * { box-sizing: border-box; margin: 0; }
  body { font: 15px/1.4 -apple-system, system-ui, sans-serif; color: var(--ink); height: 100dvh; display: flex; flex-direction: column; overscroll-behavior: none; }
  header { padding: 8px 10px 0; }
  #tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; -webkit-overflow-scrolling: touch; }
  .tab { flex: 0 0 auto; border: 1px solid #ccc; background: #fff; border-radius: 16px; padding: 6px 12px; font-size: 14px; }
  .tab.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  #controls { display: flex; gap: 6px; align-items: center; padding: 0 0 6px; overflow-x: auto; }
  .chip { flex: 0 0 auto; border: 1px solid #ccc; background: #fff; border-radius: 14px; padding: 4px 10px; font-size: 13px; color: var(--muted); }
  .chip.active { background: #eef4fb; border-color: var(--blue); color: var(--blue); }
  #view-toggle, #locate { margin-left: auto; flex: 0 0 auto; border: 1px solid #ccc; background: #fff; border-radius: 8px; padding: 4px 10px; font-size: 13px; }
  #locate { margin-left: 0; }
  #snack-banner { background: #fff8e1; border-top: 1px solid #eee0a0; border-bottom: 1px solid #eee0a0; padding: 6px 10px; font-size: 13px; display: flex; gap: 8px; align-items: center; }
  #banner-close { margin-left: auto; border: 0; background: none; font-size: 16px; }
  #error-banner { background: #fdecea; color: #8c1d18; padding: 8px 10px; font-size: 13px; }
  main { flex: 1; position: relative; min-height: 0; }
  #map { position: absolute; inset: 0; }
  #list { position: absolute; inset: 0; overflow-y: auto; padding: 8px; background: #fff; }
  .row { display: flex; align-items: center; gap: 8px; padding: 9px 8px; border-bottom: 1px solid #eee; }
  .row .val { margin-left: auto; font-weight: 600; }
  .tier-1 { background: #f3faf3; }
  .tier-3 { opacity: .55; }
  #nearby { position: absolute; left: 8px; right: 8px; bottom: 66px; z-index: 500; display: flex; gap: 6px; overflow-x: auto; }
  .card { flex: 0 0 auto; background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 8px 10px; box-shadow: 0 1px 4px rgba(0,0,0,.15); font-size: 13px; }
  .pin { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.4); position: relative; }
  .pin-big { width: 30px; height: 30px; }
  .pin-badge { position: absolute; top: -9px; right: -9px; font-size: 13px; }
  .pin-dim { opacity: .5; }
  .pin-cash { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); font-size: 9px; background: #fff; border-radius: 4px; padding: 0 3px; color: var(--muted); }
  .popup h3 { font-size: 15px; margin-bottom: 2px; }
  .popup p { margin: 3px 0; font-size: 13px; }
  .muted { color: var(--muted); }
  .btn { border: 1px solid var(--blue); color: var(--blue); background: #fff; border-radius: 8px; padding: 7px 12px; font-size: 14px; margin-top: 4px; }
  .btn.big { font-size: 18px; padding: 12px 0; flex: 1; }
  .btn.danger { border-color: var(--red); color: var(--red); }
  .btn-row { display: flex; gap: 8px; margin-top: 8px; }
  .btn-col { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .mini { border: 1px solid #ccc; background: #fff; border-radius: 6px; min-width: 30px; padding: 3px 7px; font-size: 14px; }
  #ledger { position: fixed; left: 0; right: 0; bottom: 0; z-index: 900; background: #fff; border-top: 2px solid var(--ink); transform: translateY(calc(100% - 44px)); transition: transform .2s; max-height: 75dvh; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); }
  #ledger.open { transform: none; }
  #ledger-toggle { width: 100%; border: 0; background: var(--ink); color: #fff; padding: 11px; font-size: 15px; }
  #ledger-body { overflow-y: auto; padding: 10px; }
  .totals div { font-size: 13px; margin-bottom: 3px; }
  .guest-row { display: flex; align-items: center; gap: 7px; padding: 7px 0; border-top: 1px solid #eee; font-size: 14px; }
  .bal { min-width: 46px; }
  #modal { position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; }
  #modal[hidden], #nearby[hidden], #error-banner[hidden], #snack-banner[hidden], #toast[hidden] { display: none; }
  #toast { position: fixed; left: 12px; right: 12px; bottom: 56px; z-index: 1100; background: #1b1b1b; color: #fff; border-radius: 10px; padding: 11px 14px; font-size: 14px; display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.35); }
  .toast-undo { margin-left: auto; background: none; border: 1px solid #888; color: #ffd54f; border-radius: 6px; padding: 4px 10px; font-size: 13px; }
  .sheet { background: #fff; width: 100%; border-radius: 14px 14px 0 0; padding: 16px 14px calc(16px + env(safe-area-inset-bottom)); max-height: 80dvh; display: flex; flex-direction: column; }
  .menu-legend { display: flex; flex-wrap: wrap; gap: 5px 10px; margin: 7px 0 2px; font-size: 11px; color: var(--muted); }
  .legend-item { display: inline-flex; align-items: center; gap: 4px; }
  .legend-swatch { width: 9px; height: 9px; border-radius: 2px; background: var(--credit-color); }
  .legend-breaks { flex-basis: 100%; }
  .menu-scroll { overflow-y: auto; margin: 6px 0; }
  .menu-scroll h4 { font-size: 13px; margin: 8px 0 2px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .menu-row { border-left: 4px solid var(--credit-color); padding: 4px 0 4px 8px; margin: 3px 0; }
  .credit-qs { --credit-color: var(--blue); }
  .credit-snack { --credit-color: var(--green); }
  .credit-kids { --credit-color: var(--purple); }
  .menu-item { margin: 0; font-size: 14px; }
  .value-arrow { margin-left: 5px; font-weight: 800; }
  .arrow-up { color: var(--green); }
  .arrow-flat { color: var(--amber); }
  .arrow-down { color: var(--red); }
  .menu-pairing { margin: 2px 0 0; font-size: 11px; color: var(--muted); }
  .menu-scroll > .muted { margin: 6px 0; font-size: 12px; }
  footer { font-size: 11px; color: var(--muted); padding: 4px 10px 48px; background: #fff; }
  .leaflet-container { font: inherit; }
</style>
</head>
<body>
  <div id="error-banner" hidden></div>
  <header>
    <div id="tabs"></div>
    <div id="controls">
      <div id="chips" style="display:flex;gap:6px;"></div>
      <button id="locate" title="My location">📍</button>
      <button id="view-toggle">List</button>
    </div>
  </header>
  <div id="snack-banner">
    <span>Snack rule: under $6 pay cash · $7+ use a credit · carts take snack credits on DDP-symbol items.</span>
    <button id="banner-close" aria-label="Dismiss">✕</button>
  </div>
  <main>
    <div id="map" data-areas='["mk","ep","hs","ak","bb","pop"]'></div>
    <div id="list" style="display:none"></div>
    <div id="nearby" hidden><div id="nearby-cards" style="display:flex;gap:6px;overflow-x:auto;"></div></div>
  </main>
  <footer id="captured">Data loading… · Map © OpenStreetMap contributors · ledger key ddp-ledger-v2 · migrates ddp-ledger-v1</footer>
  <div id="ledger">
    <button id="ledger-toggle">Credits ledger</button>
    <div id="ledger-body"></div>
  </div>
  <div id="modal" hidden></div>
  <div id="toast" hidden></div>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="app.mjs"></script>
</body>
</html>
